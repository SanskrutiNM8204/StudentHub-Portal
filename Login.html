<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | StudentHub</title>

    <link rel="stylesheet" href="Practical_3/script.css">
</head>

<body>

    <div class="login-container">

        <h1>StudentHub Login</h1>

        <form id="loginForm">

            <!-- User Type -->

            <div class="form-group">

                <label for="userType">
                    Select User Type
                </label>

                <select id="userType" name="userType" required>

                    <option value="">
                        -- Select User Type --
                    </option>

                    <option value="student">
                        Student
                    </option>

                    <option value="faculty">
                        Faculty
                    </option>

                    <option value="admin">
                        Admin
                    </option>

                </select>

            </div>


            <!-- Username -->

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    id="username" type="text" name="username" required>

            </div>


            <!-- Password -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    id="password"
                    type="password"
                    name="password"
                    required
                >

            </div>


            <!-- Login -->

            <input type="submit" value="Login">


            <!-- Login Message -->

            <p id="loginMessage"></p>

        </form>


        <p>
            <a href="register.html">
                Register Here
            </a>
        </p>

        <p>
            <a href="contact.html">
                Contact
            </a>
        </p>

    </div>


    <footer>

        <p>© 2026 StudentHub Portal</p>

    </footer>


    <!-- External JavaScript -->

    <script src="Practical_4/javaScript.js"></script>
</body>

</html>
