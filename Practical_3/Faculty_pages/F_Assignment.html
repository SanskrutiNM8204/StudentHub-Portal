<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Assignment | StudentHub</title>

    <link rel="stylesheet" href="../script.css">
</head>

<body>

    <header>
        <h1>StudentHub Portal</h1>
        <h2>Add Assignment</h2>
    </header>

    <nav>
        <a href="F_Dashboard.html">Dashboard</a> |
        <a href="F_Attendance.html">Attendance</a> |
        <a href="F_Courses.html">Courses</a> |
        <a href="F_Assignments.html">Assignments</a> |
        <a href="F_Student-list.html">Students</a> |
        <a href="Login.html">Logout</a>
    </nav>

    <main>

        <h2>Create New Assignment</h2>

        <form>

            <label for="assignmentTitle">
                Assignment Title:
            </label>

            <input type="text" id="assignmentTitle" name="assignmentTitle">

            <br><br>


            <label for="course">
                Course:
            </label>

            <select id="course" name="course">

                <option value="web">
                    Web Development
                </option>

                <option value="cn">
                    Computer Networks
                </option>

                <option value="dsa">
                    Data Structures
                </option>

            </select>

            <br><br>


            <label for="dueDate">
                Due Date:
            </label>

            <input
                type="date"
                id="dueDate"
                name="dueDate"
            >

            <br><br>


            <label for="description">
                Description:
            </label>

            <br>

            <textarea
                id="description"
                name="description"
                rows="5"
                cols="40"
            ></textarea>

            <br><br>

            <input
                type="submit"
                value="Add Assignment"
            >

        </form>

    </main>

    <footer>
        <p>© 2026 StudentHub Portal</p>
    </footer>

</body>

</html>
